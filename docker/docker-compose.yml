services:
  pixelweb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pixelcolorweb
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      # Pass through DBus system socket and devices for host BLE
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /dev:/dev
      # Persistent configuration, uploaded images, scripts, and fonts
      - ../data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Timezone for timeline scheduler and dynamic time scripts (e.g. Africa/Johannesburg, Europe/London, America/New_York)
      - TZ=Africa/Johannesburg
      # Logging verbosity: DEBUG, INFO, WARNING, ERROR
      - LOG_LEVEL=INFO
      # Web server port and listening interface
      - PORT=8080
      - HOST=0.0.0.0
      # BLE Device auto-reconnect fallback address (optional override)
      # - BLE_DEVICE_ADDRESS=31:6C:93:E6:5D:12

